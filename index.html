<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题练习</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 刷题练习</h1>
            <div class="progress-info">
                <span id="question-count">第 1 / 0 题</span>
                <span id="score-display">得分：0</span>
            </div>
        </header>

        <main>
            <div id="question-area">
                <div id="question-type" class="question-type"></div>
                <h2 id="question-text"></h2>
                <div id="options-area"></div>
            </div>

            <div class="button-group">
                <button id="submit-btn" class="btn btn-primary" disabled>提交答案</button>
                <button id="next-btn" class="btn btn-secondary" style="display:none;">下一题</button>
                <button id="restart-btn" class="btn btn-secondary" style="display:none;">重新开始</button>
            </div>

            <div id="result-area" class="result-area"></div>
        </main>

        <footer>
            <p>共 <span id="total-questions">0</span> 题 | 已答 <span id="answered-count">0</span> 题 | 正确 <span id="correct-count">0</span> 题</p>
        </footer>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
